server:
  port: 8090

spring:
  jackson:
    property-naming-strategy: SNAKE_CASE   # 信封字段输出 degraded_reason/elapsed_ms 等
  datasource:
    url: jdbc:sqlite:data/tool-gateway.db
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always                          # 每次启动执行 schema.sql(幂等)
      schema-locations: classpath:sql/schema.sql

gateway:
  token: ${TOOL_GATEWAY_TOKEN}              # 红线-6:环境变量注入,无默认值,缺失即启动失败
  cmdb-file: ${CMDB_FILE:deploy/cmdb.yaml}
  prometheus-base-url: ${PROMETHEUS_URL:http://localhost:9090}  # 上游,不在线时按 H3 降级
  loki-base-url: ${LOKI_URL:http://localhost:3100}
  zipkin-base-url: ${ZIPKIN_URL:http://localhost:9411}