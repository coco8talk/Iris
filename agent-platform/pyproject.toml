[project]
name = "agent-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.14.2",
    "httpx",
    "langchain>=1.3.14",
    "langchain-openai",
    "langchain-openrouter",
    "langchain_core",
    "pydantic>=2.13.4",
    "pydantic-settings",
    "pytest>=9.1.1",
